name: Deploy stats-app to stats.vaultwares.ca

on:
  push:
    branches:
      - main
    paths:
      - 'stats-app/**'
      - '.github/workflows/deploy-stats-app.yml'

concurrency:
  group: deploy-stats-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: [self-hosted, greencloud-vps]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stats-app/package-lock.json

      - name: Install dependencies
        working-directory: stats-app
        run: npm ci

      - name: Build
        working-directory: stats-app
        run: npm run build

      - name: Deploy to /var/www/stats.vaultwares.ca
        run: rsync -avz --delete stats-app/dist/ /var/www/stats.vaultwares.ca/
