name: Deploy WORK_IMPACT (Protected)

on:
  push:
    branches: [main]
    paths:
      - "events/**"
      - "scripts/**"
      - "work-impact.config.json"
      - "work-impact.state.json"
      - "WORK_IMPACT.html"
      - "api/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/deploy-work-impact.yml"

concurrency:
  group: vercel-work-impact-prod
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh WORK_IMPACT.html
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh report (incremental)
        shell: pwsh
        run: |
          ./scripts/update-work-impact.ps1

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-impact
          path: |
            WORK_IMPACT.html
            work-impact.state.json
            work-impact.config.json
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: work-impact
          path: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Verify Vercel token (safe diagnostics)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node -e "const crypto=require('crypto'); const t=(process.env.VERCEL_TOKEN||''); const clean=t.replace(/[\\r\\n]+/g,''); const org=(process.env.VERCEL_ORG_ID||'').replace(/[\\r\\n]+/g,''); const proj=(process.env.VERCEL_PROJECT_ID||'').replace(/[\\r\\n]+/g,''); console.log('vercel_token_len', t.length); console.log('vercel_token_clean_len', clean.length); console.log('vercel_org_id_len', org.length); console.log('vercel_project_id_len', proj.length); if(!clean){ console.error('Missing VERCEL_TOKEN'); process.exit(1);} if(!org||!proj){ console.error('Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID'); process.exit(1);} console.log('vercel_token_sha256_12', crypto.createHash('sha256').update(clean).digest('hex').slice(0,12));"
          VERCEL_TOKEN_CLEAN="$(printf %s "$VERCEL_TOKEN" | tr -d '\r\n')"
          vercel whoami --token "$VERCEL_TOKEN_CLEAN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          VERCEL_TOKEN_CLEAN="$(printf %s "$VERCEL_TOKEN" | tr -d '\r\n')"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN_CLEAN"
