# nginx vhost for ledger.vaultwares.ca — TAILNET-ONLY
# Install to: /etc/nginx/sites-available/ledger.vaultwares.ca
# Symlink:    ln -s /etc/nginx/sites-available/ledger.vaultwares.ca /etc/nginx/sites-enabled/
#
# TLS: Tailscale HTTPS cert (via tailscale cert) or Let's Encrypt
# Access: tailnet ACL — only allow Tailscale IPs (100.64.0.0/10)

server {
    listen 443 ssl;
    listen 100.73.93.84:443 ssl;
    server_name ledger.vaultwares.ca;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/ledger.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.vaultwares.ca/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # --- Tailnet-only access ---
    # Allow Tailscale CGNAT range only
    allow 100.64.0.0/10;
    deny all;

    location = /changes { return 308 https://monitor.vaultwares.ca/ledger$is_args$args; }
    location = /input-tracker { return 308 https://monitor.vaultwares.ca/personal-stats$is_args$args; }
    location = /work-impact { return 308 https://monitor.vaultwares.ca/work-impact$is_args$args; }
    location / { return 308 https://monitor.vaultwares.ca/ledger$is_args$args; }
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name ledger.vaultwares.ca;
    return 301 https://$host$request_uri;
}
