# nginx vhost for ledger.vaultwares.ca — TAILNET-ONLY
# Install to: /etc/nginx/sites-available/ledger.vaultwares.ca
# Symlink:    ln -s /etc/nginx/sites-available/ledger.vaultwares.ca /etc/nginx/sites-enabled/
#
# TLS: Tailscale HTTPS cert (via tailscale cert) or Let's Encrypt
# Access: tailnet ACL — only allow Tailscale IPs (100.64.0.0/10)

server {
    listen 443 ssl;
    server_name ledger.vaultwares.ca;

    # --- TLS (Tailscale certs) ---
    ssl_certificate     /etc/nginx/certs/ledger.vaultwares.ca.crt;
    ssl_certificate_key /etc/nginx/certs/ledger.vaultwares.ca.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # --- Tailnet-only access ---
    # Allow Tailscale CGNAT range only
    allow 100.64.0.0/10;
    deny all;

    # --- Serve the built React SPA ---
    root /var/www/ledger.vaultwares.ca;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Prevent caching index.html (SPA entry)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name ledger.vaultwares.ca;
    return 301 https://$host$request_uri;
}
