# stats.vaultwares.ca permanent redirect after the unified monitor migration.
# Thu, 25 Jun 2026 04:56 America/Toronto

server {
    listen 80;
    listen [::]:80;
    server_name stats.vaultwares.ca stat.vaultwares.ca;

    root /var/www/stats.vaultwares.ca;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 100.73.93.84:443 ssl;
    listen [::]:443 ssl;
    server_name stat.vaultwares.ca;

    ssl_certificate /etc/letsencrypt/live/stats.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.vaultwares.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://stats.vaultwares.ca$request_uri;
}

server {
    listen 443 ssl;
    listen 100.73.93.84:443 ssl;
    listen [::]:443 ssl;
    server_name stats.vaultwares.ca;

    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    ssl_certificate /etc/letsencrypt/live/stats.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.vaultwares.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 308 https://monitor.vaultwares.ca/work-impact$is_args$args;
    }
}
